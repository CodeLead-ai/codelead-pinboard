<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Pinboard</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      try { var shown = localStorage.getItem("pinboard.appliedTheme") || { light: "paper", dark: "navy" }[localStorage.getItem("pinboard.theme")]; if (["paper", "linen", "frost", "sage", "navy", "pitch", "dusk", "ember", "contrast-light", "contrast-dark"].indexOf(shown) !== -1) document.documentElement.setAttribute("data-theme", shown); } catch (error) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
